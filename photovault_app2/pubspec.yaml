name: photovault_app
description: "Galeria profissional com Clean Architecture e Riverpod"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # ________ UI ________________________________________
  cupertino_icons: ^1.0.8

  # ________ Estado ____________________________________
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # ________ Banco Local _______________________________
  drift: ^2.19.1
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.0

  # ________ HTTP/API __________________________________
  dio: ^5.4.3

  # ________ Camera e mídia ____________________________
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0

  # ________ Imagens da rede ___________________________
  cached_network_image: ^3.3.1

  # ________ TTS e áudio _______________________________
  flutter_tts: ^4.0.2

  # ________ Armazenamento seguro ______________________
  flutter_secure_storage: ^10.3.0
  shared_preferences: ^2.3.2

  # ________ Permissões ________________________________
  permission_handler: ^12.0.1

  # ________ Models / Serialização _____________________
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.3
  drift_dev: ^2.19.1
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true