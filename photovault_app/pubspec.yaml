name: photovault_app
description: "Galeria profissional com Clean Architecture e Riverpod"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Banco local
  drift: ^2.19.1
  drift_flutter: ^0.2.3
  sqlite3_flutter_libs: ^0.5.0

  # HTTP/API
  dio: ^5.4.3

  # Câmera e mídia
  camera: ^0.11.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0

  # Imagens da rede
  cached_network_image: ^3.3.1

  # TTS
  flutter_tts: ^4.0.2

  # Armazenamento seguro
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Permissões
  permission_handler: ^11.3.1

  # Serialização
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.1
  drift_dev: ^2.19.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true